<!doctype html><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}svg{display:block}</style>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="32%" cy="22%" r="95%">
      <stop offset="0%"  stop-color="#43307a"/>
      <stop offset="55%" stop-color="#1e1739"/>
      <stop offset="100%" stop-color="#100c20"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f7861f"/>
      <stop offset="100%" stop-color="#ffc94d"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="halo" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="17" flood-color="#ffb531" flood-opacity=".85"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- caption lines, centred on y=256 -->
  <g fill="#ffffff" filter="url(#soft)">
    <rect x="131" y="170" width="250" height="34" rx="17"/>
    <rect x="161" y="239" width="190" height="34" rx="17"/>
    <rect x="143" y="308" width="225" height="34" rx="17"/>
  </g>

  <!-- the strike: dark gap first, so the slash reads as separate from the bars -->
  <line x1="112" y1="362" x2="400" y2="150" stroke="#16112b"
        stroke-width="54" stroke-linecap="round"/>
  <line x1="112" y1="362" x2="400" y2="150" stroke="url(#gold)"
        stroke-width="30" stroke-linecap="round" filter="url(#halo)"/>
</svg>
